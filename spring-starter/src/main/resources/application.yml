# Copy application-local.yml.example to application-local.yml for local secrets.
spring:
  application:
    name: nexspace-api
  profiles:
    default: local

  datasource:
    url: "${DB_URL:}"
    username: "${DB_USERNAME:}"
    password: "${DB_PASSWORD:}"
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      connection-init-sql: "SET SESSION time_zone = '+00:00'"

  flyway:
    enabled: true
    locations: classpath:db/migration
    encoding: UTF-8
    validate-on-migrate: true
    validate-migration-naming: true
    baseline-on-migrate: false
    clean-disabled: true

  jpa:
    hibernate:
      # Flyway owns DDL. Fail if entity mappings do not match the migrated schema.
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 50
          time_zone: UTC
        order_inserts: true
        order_updates: true
        default_batch_fetch_size: 50

  mail:
    host: "${MAIL_HOST:smtp.gmail.com}"
    port: "${MAIL_PORT:587}"
    username: "${MAIL_USERNAME:}"
    password: "${MAIL_PASSWORD:}"
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

server:
  port: "${SERVER_PORT:8080}"

app:
  client-url: "${CLIENT_URL:http://localhost:3000}"
  api-url: "${API_URL:http://localhost:8080}"
  # Comma-separated exact frontend origins; no implicit localhost wildcard.
  cors:
    allowed-origins: "${CORS_ALLOWED_ORIGINS:http://localhost:3000}"
  jwt:
    # Override with a secret of at least 32 bytes.
    secret: "${JWT_SECRET:}"
    expiration-ms: "${JWT_EXPIRATION_MS:900000}"
  auth:
    email-verification-enabled: "${EMAIL_VERIFICATION_ENABLED:false}"
    verification-token-ttl-hours: 48
    reset-token-ttl-minutes: 60
    session-ttl-days: 30
  seed:
    admin:
      enabled: "${SEED_ADMIN_ENABLED:false}"
      email: "${SEED_ADMIN_EMAIL:admin@example.com}"
      password: "${SEED_ADMIN_PASSWORD:}"

springdoc:
  api-docs:
    path: /v3/api-docs
  packages-to-scan: base.api.feature
  paths-to-match: /api/**
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    doc-expansion: none
    display-request-duration: true
    disable-swagger-default-url: true
    persist-authorization: false

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
  health:
    mail:
      enabled: false

logging:
  pattern:
    level: "%5p [requestId=%X{requestId:-}]"
