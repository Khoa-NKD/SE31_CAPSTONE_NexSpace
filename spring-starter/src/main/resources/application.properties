spring.application.name=spring-starter
server.port=${SERVER_PORT:8080}

# Local secrets (DB, mail, JWT) live in application-local.properties (gitignored).
# Copy application-local.properties.example -> application-local.properties to start.
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}
app.organizer.bank.encryption-key=${ORGANIZER_BANK_ENCRYPTION_KEY:}

# ── Database (MySQL) ────────────────────────────────────────────────
spring.datasource.url=${DB_URL:}
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# update = Hibernate tự tạo/cập nhật bảng theo entity. Đổi sang validate/none khi dùng migration tool.
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.default_batch_fetch_size=50

# ── URLs ────────────────────────────────────────────────────────────
app.client-url=${CLIENT_URL:http://localhost:5173}
app.api-url=${API_URL:http://localhost:8080}
# Comma-separated list of exact origins allowed by CORS (localhost:* is always allowed).
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}

# ── JWT ─────────────────────────────────────────────────────────────
# Secret must be at least 32 bytes (HS256). Always override in real environments.
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ── Auth ────────────────────────────────────────────────────────────
# true  = register sends a verification email; login is blocked until verified.
# false = new accounts are verified immediately (no SMTP needed).
app.auth.email-verification-enabled=${EMAIL_VERIFICATION_ENABLED:false}
app.auth.verification-token-ttl-hours=48
app.auth.reset-token-ttl-minutes=60

# Default admin seeded on first boot (only when no user with that email exists).
app.seed.admin.enabled=${SEED_ADMIN_ENABLED:true}
app.seed.admin.email=${SEED_ADMIN_EMAIL:admin@nexspace.vn}
app.seed.admin.username=${SEED_ADMIN_USERNAME:admin}
app.seed.admin.password=${SEED_ADMIN_PASSWORD:}

# Default organizer seeded on first boot (only when no user with that email exists).
app.seed.organizer.enabled=${SEED_ORGANIZER_ENABLED:true}
app.seed.organizer.email=${SEED_ORGANIZER_EMAIL:organizer@nexspace.vn}
app.seed.organizer.username=${SEED_ORGANIZER_USERNAME:organizer}
app.seed.organizer.password=${SEED_ORGANIZER_PASSWORD:}

# ── Mail (SMTP) ─────────────────────────────────────────────────────
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.default-encoding=UTF-8
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# ── Cloudinary Media Storage ─────────────────────────────────────────
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}
cloudinary.folder=${CLOUDINARY_FOLDER:nexspace/workspaces}

# ── Multipart Upload (BR-37: 5MB per file) ───────────────────────────
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=20MB

# ── Swagger ─────────────────────────────────────────────────────────
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method

# Organizer submission: private storage is supplied via APP_ORGANIZER_DOCUMENTS_DIRECTORY.
app.organizer.documents-directory=${APP_ORGANIZER_DOCUMENTS_DIRECTORY:${user.home}/.nexspace/organizer-documents}
app.organizer.documents-cloudinary-enabled=${ORGANIZER_DOCUMENTS_CLOUDINARY_ENABLED:true}
