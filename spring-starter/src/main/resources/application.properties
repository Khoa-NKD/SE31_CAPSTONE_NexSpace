spring.application.name=spring-starter
server.port=${SERVER_PORT:8080}

# Local secrets (DB, mail, JWT) live in application-local.properties (gitignored).
# Copy application-local.properties.example -> application-local.properties to start.
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}
app.organizer.bank.encryption-key=${ORGANIZER_BANK_ENCRYPTION_KEY:}

# ── Database (MySQL) ────────────────────────────────────────────────
spring.datasource.url=${DB_URL:}
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ── Database Migration (Flyway) ─────────────────────────────────────
spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=${FLYWAY_BASELINE_ON_MIGRATE:true}
spring.flyway.baseline-version=${FLYWAY_BASELINE_VERSION:0}

# update = Hibernate tự tạo/cập nhật bảng theo entity. Đổi sang validate/none khi dùng migration tool.
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.default_batch_fetch_size=50

# ── URLs ────────────────────────────────────────────────────────────
app.client-url=${CLIENT_URL:http://localhost:5173}
app.api-url=${API_URL:http://localhost:8080}
# Comma-separated list of exact origins allowed by CORS (localhost:* is always allowed).
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}

# ── JWT ─────────────────────────────────────────────────────────────
# Secret must be at least 32 bytes (HS256). Always override in real environments.
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ── Auth ────────────────────────────────────────────────────────────
# true  = register sends a verification email; login is blocked until verified.
# false = new accounts are verified immediately (no SMTP needed).
app.auth.email-verification-enabled=${EMAIL_VERIFICATION_ENABLED:false}
app.auth.verification-token-ttl-hours=48
app.auth.reset-token-ttl-minutes=60
# Số ngày không đăng nhập trước khi tài khoản tự động chuyển sang INACTIVE (mặc định 90 ngày ~ 3 tháng)
app.auth.inactive-threshold-days=${INACTIVE_THRESHOLD_DAYS:90}
# Chu kỳ chạy tác vụ kiểm tra tài khoản không hoạt động (mặc định mỗi giờ)
app.auth.inactive-check-cron=${INACTIVE_CHECK_CRON:0 0 * * * *}

# ── Mail (SMTP) ─────────────────────────────────────────────────────
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.default-encoding=UTF-8
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# ── Cloudinary Media Storage ─────────────────────────────────────────
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}
cloudinary.folder.nexspace=${CLOUDINARY_FOLDER_NEXSPACE:nexspace}
cloudinary.folder.nexspace.workspace=${CLOUDINARY_FOLDER_WORKSPACE:${cloudinary.folder.nexspace}/workspaces/{id}}

# ── Multipart Upload (BR-37: 5MB per file) ───────────────────────────
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=20MB

# ── Swagger ─────────────────────────────────────────────────────────
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method

# Organizer submission: private storage is supplied via APP_ORGANIZER_DOCUMENTS_DIRECTORY.
app.organizer.documents-directory=${APP_ORGANIZER_DOCUMENTS_DIRECTORY:${user.home}/.nexspace/organizer-documents}
app.organizer.documents-cloudinary-enabled=${ORGANIZER_DOCUMENTS_CLOUDINARY_ENABLED:true}

# ── PayOS Payment Gateway Configuration ──────────────────────────────────────
nexspace.payos.client-id=${PAYOS_CLIENT_ID:}
nexspace.payos.api-key=${PAYOS_API_KEY:}
nexspace.payos.checksum-key=${PAYOS_CHECKSUM_KEY:}
nexspace.payos.return-url=${PAYOS_RETURN_URL:http://localhost:5173/workspaces/confirmation}
nexspace.payos.cancel-url=${PAYOS_CANCEL_URL:http://localhost:5173/workspaces/review}
nexspace.booking.hold-minutes=${BOOKING_HOLD_MINUTES:10}
nexspace.payment.usd-to-vnd-rate=${PAYMENT_USD_TO_VND_RATE:25450}
cloudinary.folder.nexspace.invoices=${CLOUDINARY_FOLDER_INVOICES:nexspace/invoices}

